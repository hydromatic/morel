#
# Tests against a live Spark Connect server, weekly, and everything that
# is too slow or too fragile to ask of every push: a container made
# afresh, and the corpus built by the PySpark client, which is the only
# thing that says whether the plans of spark-plan-generated.smli are
# the ones Spark builds.
#
# One configuration of the regular CI (main.yml) also starts a server, so
# that a change that breaks the adapter is caught on the push that breaks
# it. This workflow is the slower, more thorough one.
name: Spark

on:
  workflow_dispatch: # allow manual triggering
  schedule:
    # Run at 0617 UTC every Monday
    #        m  h  dom mon dow
    - cron: '17 06   *   *   1'

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'
          cache: 'maven'
      - name: Start Spark Connect server
        run: |
          uri=$(src/test/resources/spark/start-spark.sh --new)
          echo "SPARK_REMOTE=$uri" >> "$GITHUB_ENV"
      - name: Check the generated plans against the PySpark client
        run: |
          python3 -m venv pyenv
          pyenv/bin/pip install --quiet pyspark-client
          pyenv/bin/python src/test/resources/spark/capture.py --execute \
            > /tmp/generated.smli
          diff src/test/resources/script/spark-plan-generated.smli \
            /tmp/generated.smli
      - name: Build and test with live Spark
        run: ./mvnw --batch-mode verify -Dmorel.spark=true
      - name: Server log on failure
        if: failure()
        run: docker logs --tail 200 morel-spark

# End spark.yml
